spring:
  application:
    name: ticket

  datasource:
    url: jdbc:postgresql://localhost:5432/postgres
    username: postgres
    password: MyPostgresPass

  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
    show-sql: true

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:9090/realms/Event-ticket-platform